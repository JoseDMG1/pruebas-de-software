services:
  moodle-db:
    image: postgres:17-alpine
    env_file: .moodle.env
    environment:
      POSTGRES_USER: moodle
      POSTGRES_DB: moodle
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - moodle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moodle -d moodle']
      interval: 5s
      timeout: 3s
      retries: 20
  moodle:
    build:
      context: .
      dockerfile: dev/moodle/Dockerfile
    env_file: .moodle.env
    network_mode: host
    volumes:
      - ./moodle:/var/www/moodle
      - ./dev/moodle:/opt/moodle-dev:ro
      - moodle-vendor:/var/www/moodle/vendor
      - moodle-data:/var/moodledata
      - moodle-test-data:/var/moodletestdata
    depends_on:
      moodle-db:
        condition: service_healthy
volumes:
  moodle-db-data:
  moodle-data:
  moodle-vendor:
  moodle-test-data:
