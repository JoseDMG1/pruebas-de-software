name: Validar Sprint 1
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: test_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      TEST_DATABASE_URL: postgresql://rag:test_local_only@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest -q --strict-markers --require-complete
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.ollama.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.aws.yaml -f compose.ollama.yaml config --quiet
        env:
          AWS_CONFIG_DIR: /tmp/rag-ci-aws
          LOCAL_UID: '1000'
          LOCAL_GID: '1000'
