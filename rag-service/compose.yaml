services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/rag_service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag_local_dev@db:5432/rag
      MOODLE_SERVICE_SECRET: ${MOODLE_SERVICE_SECRET:-}
      LOCAL_DEMO_QUERY_ENABLED: ${LOCAL_DEMO_QUERY_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-latest}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-120}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS:-2000}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-200}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-300}
      MAX_CHUNKS: ${MAX_CHUNKS:-1000}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/inbox:/data/inbox:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
