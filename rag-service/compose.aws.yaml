# Añadir solo al ejecutar la CLI que necesita acceso a Bedrock.
services:
  api:
    user: ${LOCAL_UID:?Definir LOCAL_UID}:${LOCAL_GID:?Definir LOCAL_GID}
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-jdesprout}
      AWS_SHARED_CREDENTIALS_FILE: /home/app/.aws/credentials
      AWS_CONFIG_FILE: /home/app/.aws/config
    volumes:
      - ${AWS_CONFIG_DIR:?Definir AWS_CONFIG_DIR con la ruta a .aws}:/home/app/.aws:ro
